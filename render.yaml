services:
  - type: web
    name: libro-reclamaciones
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: libro-reclamaciones-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      # Completar con los datos reales de la empresa:
      # - key: EMPRESA_RAZON_SOCIAL
      #   value: "TU EMPRESA S.A.C."
      # - key: EMPRESA_NOMBRE
      #   value: "Nombre Comercial"
      # - key: EMPRESA_RUC
      #   value: "20000000000"
      # - key: EMPRESA_DOMICILIO
      #   value: "Av. Ejemplo 123, Lima"
      # Configurar SMTP real:
      # - key: EMAIL_HOST
      #   value: "smtp.gmail.com"
      # - key: EMAIL_PORT
      #   value: "587"
      # - key: EMAIL_USE_TLS
      #   value: "True"
      # - key: EMAIL_HOST_USER
      #   value: "correo@empresa.com"
      # - key: EMAIL_HOST_PASSWORD
      #   sync: false
      # - key: DEFAULT_FROM_EMAIL
      #   value: "reclamos@empresa.com"

databases:
  - name: libro-reclamaciones-db
    databaseName: libro_reclamaciones
    user: libro_user
